[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiattcalib"
version = "0.1.1"
description = "Authors' experimental implementation of validity-guided reciprocal LiDAR-camera residual calibration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "Pillow>=10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
multiattcalib = "multiattcalib.cli:main"

[tool.setuptools.packages.find]
include = ["multiattcalib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
